<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" aria-labelledby="title desc">
<title id="title">Verification returns to requirements; validation to intended use</title>
<desc id="desc">Four boxes show need and intended use, requirements, software and models, and results and evidence. The teal verification loop returns to requirements. The purple validation loop returns to need, ConOps, users and conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526a7a"/></marker><marker id="verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087386"/></marker><marker id="validate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7542a3"/></marker></defs>
<rect width="360" height="680" fill="#fff" rx="10"/>
<g fill="none" stroke="#526a7a" stroke-width="3" marker-end="url(#arrow)"><path d="M218 130V195"/><path d="M218 300V365"/><path d="M218 470V535"/></g>
<path d="M90 590H23V75H85" fill="none" stroke="#7542a3" stroke-width="3" marker-end="url(#validate)"/>
<path d="M90 620H57V248H85" fill="none" stroke="#087386" stroke-width="3" marker-end="url(#verify)"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#183047">
<rect x="90" y="20" width="255" height="110" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/>
<text x="218" y="52" font-size="22" font-weight="700">Scientific need</text><text x="218" y="81" font-size="22" font-weight="700">and intended use</text><text x="218" y="112" font-size="17">ConOps · users · conditions</text>
<rect x="90" y="195" width="255" height="105" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/>
<text x="218" y="237" font-size="22" font-weight="700">Requirements</text><text x="218" y="270" font-size="20">and acceptance criteria</text>
<rect x="90" y="365" width="255" height="105" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/>
<text x="218" y="425" font-size="22" font-weight="700">Software and models</text>
<rect x="90" y="535" width="255" height="105" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/>
<text x="218" y="595" font-size="22" font-weight="700">Results and evidence</text>
<g transform="translate(23 355) rotate(-90)"><rect x="-60" y="-16" width="120" height="30" fill="#fff"/><text x="0" y="6" font-size="20" font-weight="700" fill="#60328d">Validation</text></g>
<g transform="translate(57 447) rotate(-90)"><rect x="-65" y="-16" width="130" height="30" fill="#fff"/><text x="0" y="6" font-size="20" font-weight="700" fill="#075f73">Verification</text></g>
</g></svg>
