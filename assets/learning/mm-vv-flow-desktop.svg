<rect x="646" y="310" width="240" height="95" rx="10" fill="#eaf7f8" stroke="#087386" stroke-width="2"/>
<text x="766" y="345" font-size="23" font-weight="750" fill="#075f73">Verification</text><text x="766" y="378" font-size="19">Meets the specification?</text>
