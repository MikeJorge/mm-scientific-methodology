<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">MM verification and validation feedback</title>
<desc id="desc">Scientific need and intended use lead to requirements, software and evidence. Verification returns from evidence to requirements. Validation returns from evidence to scientific need, ConOps, users and operating conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526a7a"/></marker><marker id="verify" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087386"/></marker><marker id="validate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7542a3"/></marker></defs>
<rect width="900" height="620" fill="#fff" rx="12"/>
<g fill="none" stroke="#526a7a" stroke-width="3" marker-end="url(#arrow)"><path d="M450 130V170"/><path d="M450 270V310"/><path d="M450 410V450"/></g>
<path d="M275 500H80V80H270" fill="none" stroke="#7542a3" stroke-width="4" marker-end="url(#validate)"/>
<path d="M625 520H825V220H630" fill="none" stroke="#087386" stroke-width="4" marker-end="url(#verify)"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#183047">
<g><rect x="275" y="30" width="350" height="100" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/><text x="450" y="59" font-size="23" font-weight="700">Scientific need</text><text x="450" y="88" font-size="23" font-weight="700">and intended use</text><text x="450" y="115" font-size="18">ConOps · users · conditions</text></g>
<g><rect x="275" y="170" width="350" height="100" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/><text x="450" y="210" font-size="23" font-weight="700">Requirements</text><text x="450" y="244" font-size="21">and acceptance criteria</text></g>
<g><rect x="275" y="310" width="350" height="100" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/><text x="450" y="369" font-size="23" font-weight="700">Software and models</text></g>
<g><rect x="275" y="450" width="350" height="100" rx="10" fill="#edf4fa" stroke="#8faebe" stroke-width="2"/><text x="450" y="509" font-size="23" font-weight="700">Results and evidence</text></g>
